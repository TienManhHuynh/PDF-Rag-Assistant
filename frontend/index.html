<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF RAG Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"/>
  <link rel="stylesheet" href="/assets/css/base.css"/>
  <link rel="stylesheet" href="/assets/css/sidebar.css"/>
  <link rel="stylesheet" href="/assets/css/chat.css"/>
  <link rel="stylesheet" href="/assets/css/sources.css"/>
  <link rel="stylesheet" href="/assets/css/responsive.css"/>
</head>
<body>
<div id="app">

  <!-- ══════════ SIDEBAR ══════════ -->
  <aside class="rag-sidebar" id="sidebar" aria-label="Workspace và lịch sử">
    <div class="sb-logo">
      <div class="sb-logo-icon">📚</div>
      PDF RAG Assistant
    </div>

    <!-- Google Login / User Info -->
    <div class="user-card" id="userCard">
      <div class="user-avatar-placeholder" id="userAvatarPlaceholder">?</div>
      <span class="user-name" id="userNameEl">Chưa đăng nhập</span>
      <button class="btn-auth" id="btnAuth">Đăng nhập</button>
    </div>

    <!-- Chat History (hiển thị khi đã đăng nhập) -->
    <div id="historySection" style="display:none">
      <div class="sb-section-label">Lịch sử chat</div>
      <div class="history-list" id="historyList"></div>
      <button class="hist-new-btn" id="btnNewChat">
        ✏️ Cuộc hội thoại mới
      </button>
    </div>

    <hr class="sb-divider"/>

    <!-- Workspace -->
    <div class="sb-section-label">Không gian tài liệu</div>
    <div class="ws-list" id="wsList"></div>
    <div class="create-ws">
      <input id="newWsInput" aria-label="Tên workspace mới" placeholder="Tên workspace mới..." maxlength="50"/>
      <button class="btn-new-ws" id="btnCreateWs" title="Tạo workspace">+</button>
    </div>

    <hr class="sb-divider"/>

    <!-- Upload -->
    <div class="upload-zone" id="btnUploadZone" role="button" tabindex="0" aria-label="Tải tài liệu PDF">
      <div class="uz-icon">☁️</div>
      <p>Kéo & thả PDF hoặc <span>chọn file</span></p>
    </div>
    <input type="file" id="fileInput" accept=".pdf" multiple style="display:none"/>
    <div class="upload-progress" id="uploadProgress">
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel"></div>
    </div>
    <div class="upload-toast" id="uploadToast" role="status" aria-live="polite"></div>

    <!-- Bottom tools -->
    <div class="sb-tools">
      <button class="tool-btn" id="btnClearChat">🗑️ Xóa chat hiện tại</button>
      <button class="tool-btn danger" id="btnDeleteWs">✕ Xóa workspace</button>
    </div>
  </aside>

  <!-- ══════════ CHAT ══════════ -->
  <main class="rag-chat">
    <div class="chat-topbar">
      <button class="panel-toggle" id="btnSidebar" aria-label="Mở workspace" aria-controls="sidebar" aria-expanded="false">☰</button>
      <span class="chat-topbar-title">Góc học tập</span>
      <span class="ws-pill" id="wsPill">—</span>
      <div class="topbar-spacer"></div>
      <button class="btn-summarize-top" id="btnSummarize">📝 Tóm tắt</button>
      <button class="panel-toggle sources-toggle" id="btnSources" aria-controls="sources" aria-expanded="false">Tài liệu</button>
      <div class="api-status" role="status">
        <div class="api-dot" id="apiDot"></div>
        <span id="apiLabel">Đang kiểm tra...</span>
      </div>
    </div>

    <div class="chat-msgs" id="chatMsgs" role="log" aria-label="Cuộc hội thoại" aria-live="polite"></div>
    <div class="voice-indicator" id="voiceIndicator">🔴 Đang lắng nghe...</div>

    <div class="chat-input-area">
      <div class="chat-input-box">
        <textarea id="chatInput" aria-label="Câu hỏi về tài liệu" rows="1" placeholder="Chọn workspace trước..."></textarea>
        <div class="input-actions">
          <!-- Web Search toggle -->
          <button class="btn-web-search" id="btnWebSearch" aria-pressed="false" title="Bật / tắt Web Search">
            🌐 Web Search
          </button>
          <span class="input-hint">Enter gửi · Shift+Enter xuống dòng</span>
          <!-- Voice input -->
          <button class="btn-voice" id="btnVoice" title="Nhập bằng giọng nói">🎤</button>
          <button class="btn-send" id="btnSend" aria-label="Gửi câu hỏi">
            <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- ══════════ SOURCES PANEL ══════════ -->
  <aside class="rag-sources" id="sources" aria-label="Tài liệu tham khảo">
    <div class="src-header">
      <span class="src-header-title">📄 Tài liệu</span>
      <span class="src-badge" id="srcBadge">0 tài liệu</span>
    </div>
    <div class="src-list" id="srcList"></div>
    <hr class="src-divider"/>
    <div class="lookup-section">
      <div class="lookup-label">Tra thuật ngữ</div>
      <div class="lookup-row">
        <input id="peInput" aria-label="Thuật ngữ cần tra" placeholder="Nhập thuật ngữ..."/>
        <button class="btn-lookup" id="btnPanelExplain">Tra</button>
      </div>
      <div class="lookup-result" id="peResult"></div>
    </div>
  </aside>

</div><!-- #app -->
<button class="panel-backdrop" id="panelBackdrop" aria-label="Đóng bảng bên"></button>

<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
